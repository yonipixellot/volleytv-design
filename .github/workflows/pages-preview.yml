name: Deploy PR Preview to GitHub Pages

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'apps/halo-angular/**'
      - '.github/workflows/pages-preview.yml'
      - '.github/scripts/pages-buffer.sh'
      - 'package.json'
      - 'bunfig.toml'

permissions:
  contents: write
  pages: write
  id-token: write
  pull-requests: write

# Shared with pages.yml / pages-cleanup.yml - see pages.yml for why.
concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Runs before the build so a spacing violation fails in seconds rather
      # than after a full Angular compile. See DESIGN.md — The Raw-Value Rule.
      - name: Lint spacing tokens
        working-directory: apps/halo-angular
        run: node tools/lint-spacing.mjs

      - name: Build Angular app for preview
        working-directory: apps/halo-angular
        run: npm run build -- --base-href="/${{ github.event.repository.name }}/previews/pr-${{ github.event.number }}/"

      - name: Prepare gh-pages buffer
        run: .github/scripts/pages-buffer.sh prepare

      - name: Update this PR's preview in buffer
        run: |
          rm -rf pages-buffer/previews/pr-${{ github.event.number }}
          mkdir -p pages-buffer/previews/pr-${{ github.event.number }}
          cp -r apps/halo-angular/dist/halo-web/browser/. pages-buffer/previews/pr-${{ github.event.number }}/

      - name: Publish buffer to gh-pages
        run: |
          .github/scripts/pages-buffer.sh publish "preview: pr-${{ github.event.number }} ${{ github.sha }}"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-buffer

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Comment PR with preview link
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.issue.number;
            const previewUrl = `${{ steps.deployment.outputs.page_url }}previews/pr-${prNumber}/`;

            const { data: comments } = await github.rest.issues.listComments({
              issue_number: prNumber,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const marker = '🚀 **PR Preview deployed!**';
            const existing = comments.find(c => c.body.includes(marker));
            const body = `${marker}\n\n[View preview](${previewUrl})\n\n*This preview will be updated on each commit and removed automatically ~7 days after the last update.*`;

            if (existing) {
              await github.rest.issues.updateComment({ comment_id: existing.id, owner: context.repo.owner, repo: context.repo.repo, body });
            } else {
              await github.rest.issues.createComment({ issue_number: prNumber, owner: context.repo.owner, repo: context.repo.repo, body });
            }
