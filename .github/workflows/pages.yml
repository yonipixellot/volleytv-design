name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'apps/halo-angular/**'
      - '.github/workflows/pages.yml'
      - '.github/scripts/pages-buffer.sh'
      - 'package.json'
      - 'bunfig.toml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Shared across pages.yml / pages-preview.yml / pages-cleanup.yml: they all
# read-modify-write the same gh-pages buffer branch, so only one may run at a
# time or their pushes race each other.
concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Project site: Pages serves this repo at <owner>.github.io/<repo>/, so the
      # base href is the repo name. Change to "/" only if a custom domain is attached.
      - name: Build Angular app
        working-directory: apps/halo-angular
        run: npm run build -- --base-href="/${{ github.event.repository.name }}/"

      - name: Prepare gh-pages buffer
        run: .github/scripts/pages-buffer.sh prepare

      - name: Update production content in buffer
        run: |
          # Overwrite everything at the buffer root EXCEPT previews/, which
          # holds other workflows' PR previews and isn't ours to touch.
          find pages-buffer -mindepth 1 -maxdepth 1 ! -name previews ! -name .git -exec rm -rf {} +
          cp -r apps/halo-angular/dist/halo-web/browser/. pages-buffer/
          # 404.html enables SPA deep-linking for both root and preview routes.
          cp 404.html pages-buffer/404.html

      - name: Publish buffer to gh-pages
        run: |
          .github/scripts/pages-buffer.sh publish "prod: ${{ github.sha }}"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-buffer

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
