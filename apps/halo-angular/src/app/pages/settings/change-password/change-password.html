<halo-settings-page [title]="done() ? ('pw.changed' | t) : ('pw.change' | t)" [autoBack]="true">
  @if (done()) {
    <div class="success">
      <span class="coin ok"><halo-icon name="check" [size]="26" /></span>
      <h2>{{ 'auth.passwordUpdated' | t }}</h2>
      <p>{{ 'pw.updatedLead' | t }}</p>
      <halo-button variant="glass" (press)="back()">{{ 'gs.done' | t }}</halo-button>
    </div>
  } @else {
    <halo-form-field
      [label]="'account.currentPassword' | t"
      type="password"
      placeholder="••••••••"
      [value]="current()"
      (valueChange)="current.set($event)"
    />
    <halo-form-field
      [label]="'pw.newPassword' | t"
      type="password"
      placeholder="••••••••"
      [hint]="'pw.atLeast8' | t"
      [value]="next()"
      (valueChange)="next.set($event)"
    />
    <halo-form-field
      [label]="'pw.confirmNew' | t"
      type="password"
      placeholder="••••••••"
      [error]="mismatch()"
      [value]="confirm()"
      (valueChange)="confirm.set($event)"
    />
    <halo-button variant="primary" [block]="true" [disabled]="!canSubmit()" (press)="submit()">
      {{ 'pw.update' | t }}
    </halo-button>
    <p class="note">{{ 'pw.note' | t }}</p>
  }
</halo-settings-page>
